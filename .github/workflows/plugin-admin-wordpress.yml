name: Plugin Admin - WordPress integration

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '私库完整提交 SHA / Exact 40-character private source commit SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  wordpress:
    name: WordPress 7.1.3 / PHP ${{ matrix.php }} / MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      WP_VERSION: '7.1.3'
      MYSQL_PASSWORD: ci-disposable-only
    steps:
      - name: Require an immutable source commit
        shell: bash
        run: |
          [[ "$SOURCE_REF" =~ ^[a-fA-F0-9]{40}$ ]] || { echo 'source_ref must be a complete commit SHA.'; exit 1; }
      - name: Fetch private source
        uses: actions/checkout@v4
        with:
          repository: mgz0227/Plugin-Admin
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TOKEN_MGZ }}
          persist-credentials: false
      - name: Verify checked-out commit and prepare statistics
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "${SOURCE_REF,,}" ]]
          mkdir -p artifacts/wordpress-ci-summary
          printf 'source=%s\nwordpress=%s\nphp=%s\nmysql=8.4\n' "$SOURCE_REF" "$WP_VERSION" '${{ matrix.php }}' > artifacts/wordpress-ci-summary/results.txt
          echo "WP_ROOT=$RUNNER_TEMP/wordpress-site" >> "$GITHUB_ENV"
          echo "WP_SECRET_ROOT=$RUNNER_TEMP/wordpress-secrets" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mysqli
          tools: wp-cli
          coverage: none
      - name: Build and verify the production-only ZIP
        shell: bash
        run: |
          npm ci
          node --test scripts/build-wordpress.test.mjs
          npm run package:wordpress
          python3 - <<'PY'
          import glob, zipfile
          paths = glob.glob('artifacts/plugin-admin-wordpress-*.zip')
          assert len(paths) == 1, 'Expected one production ZIP'
          with zipfile.ZipFile(paths[0]) as archive:
              assert archive.testzip() is None, 'Invalid ZIP CRC'
              names = archive.namelist()
              allowed = {'plugin-admin/plugin-admin.php', *('plugin-admin/includes/' + name + '.php' for name in ['Error','Store','ProductDetails','Platform','Security','Native','Theme','WordPress'])}
              assert len(names) == len(set(names))
              assert all(name in allowed or name.startswith('plugin-admin/assets/') for name in names)
              assert all('/tests/' not in name and not name.endswith(('.pem','.key','.map')) and '/.' not in name for name in names)
          print('Production ZIP allowlist and CRC verified.')
          PY
          printf 'package=PASS\n' >> artifacts/wordpress-ci-summary/results.txt
      - name: PHP syntax and signature checks
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > "$RUNNER_TEMP/php-lint.log" 2>&1; then
              echo 'PHP syntax check failed; raw diagnostics remain private on this disposable runner.'
              printf 'php-lint=FAIL\n' >> artifacts/wordpress-ci-summary/results.txt
              exit 1
            fi
            count=$((count + 1))
          done < <(find wordpress/plugin-admin -type f -name '*.php' -print0)
          printf 'php-lint=PASS files:%s\n' "$count" >> artifacts/wordpress-ci-summary/results.txt
          if ! php wordpress/plugin-admin/tests/security.php --export "$RUNNER_TEMP/php-public-fixtures.json" > "$RUNNER_TEMP/php-security.log" 2>&1; then
            echo 'PHP signature checks failed; no private diagnostics published.'
            printf 'php-security=FAIL\n' >> artifacts/wordpress-ci-summary/results.txt
            exit 1
          fi
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {verify} from 'node:crypto';
          import assert from 'node:assert/strict';
          const fixture=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/php-public-fixtures.json`));
          for(const name of ['onlinePerpetual','perpetual','subscription','statusActive','statusRevoked']) {
            const {payload,signature}=fixture[name];
            assert(verify('RSA-SHA256',Buffer.from(payload,'ascii'),fixture.publicKeyPem,Buffer.from(signature,'base64url')),'Cross-runtime signature check failed');
          }
          const claims=name=>JSON.parse(Buffer.from(fixture[name].payload,'base64url'));
          assert.equal(claims('onlinePerpetual').expiresAt,null);
          assert.equal(claims('perpetual').expiresAt,null);
          assert.equal(claims('subscription').mode,'offline');
          assert.equal(claims('statusRevoked').nonce,fixture.nonce);
          assert.equal(claims('statusRevoked').status,'revoked');
          console.log('Node verified five PHP-signed synthetic envelopes.');
          JS
          printf 'php-security=PASS\nnode-verifies-php=PASS envelopes:5\n' >> artifacts/wordpress-ci-summary/results.txt
          if ! php wordpress/plugin-admin/tests/theme.php > "$RUNNER_TEMP/php-theme.log" 2>&1; then
            echo 'RiPro theme bridge checks failed; no private diagnostics published.'
            printf 'theme=FAIL\n' >> artifacts/wordpress-ci-summary/results.txt
            exit 1
          fi
          printf 'theme=PASS\n' >> artifacts/wordpress-ci-summary/results.txt
      - name: Install a disposable official WordPress site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WP_ROOT" "$WP_SECRET_ROOT"
          chmod 700 "$WP_SECRET_ROOT"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$WP_SECRET_ROOT/license-private.pem" > /dev/null 2>&1
          chmod 600 "$WP_SECRET_ROOT/license-private.pem"
          wp core download --version="$WP_VERSION" --path="$WP_ROOT" --skip-content --quiet
          wp config create --path="$WP_ROOT" --dbname=plugin_admin_wordpress_ci --dbuser=root --dbpass="$MYSQL_PASSWORD" --dbhost=127.0.0.1:3306 --skip-check --quiet
          wp config set MGZ_PA_PRIVATE_KEY_FILE "$WP_SECRET_ROOT/license-private.pem" --type=constant --path="$WP_ROOT" --quiet
          wp config set DISABLE_WP_CRON true --raw --type=constant --path="$WP_ROOT" --quiet
          php -r '$db=new mysqli("127.0.0.1","root",getenv("MYSQL_PASSWORD"),"",3306);$db->query("CREATE DATABASE plugin_admin_wordpress_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8888 --title='Disposable Plugin Admin CI' --admin_user=ci-administrator --admin_password="$password" --admin_email=ci@example.test --skip-email --quiet
          mkdir -p "$WP_ROOT/wp-content/plugins"
          unzip -q artifacts/plugin-admin-wordpress-*.zip -d "$WP_ROOT/wp-content/plugins"
          if ! wp plugin activate plugin-admin --path="$WP_ROOT" > "$RUNNER_TEMP/wp-activate.log" 2>&1; then
            echo 'Plugin activation failed; raw diagnostics are not published.'
            printf 'activation=FAIL\n' >> artifacts/wordpress-ci-summary/results.txt
            exit 1
          fi
          [[ "$(wp core version --path="$WP_ROOT")" == "$WP_VERSION" ]]
          printf 'activation=PASS\n' >> artifacts/wordpress-ci-summary/results.txt
      - name: Platform, native protocol and REST integration
        shell: bash
        env:
          MGZ_PA_TEST_ALLOW: '1'
        run: |
          set -euo pipefail
          failed=0
          for suite in platform native rest products; do
            if wp eval-file "$GITHUB_WORKSPACE/wordpress/plugin-admin/tests/run.php" "$GITHUB_WORKSPACE/wordpress/plugin-admin/tests/$suite.php" --use-include --path="$WP_ROOT" > "$RUNNER_TEMP/wp-$suite.log" 2>&1; then
              printf '%s=PASS\n' "$suite" | tee -a artifacts/wordpress-ci-summary/results.txt
              grep -E '^MGZ_TEST_PASS suite=(platform|native|rest|products)$' "$RUNNER_TEMP/wp-$suite.log" || true
              grep -E '^(Native WordPress|WordPress REST) integration passed \([0-9]+ checks\)\.$' "$RUNNER_TEMP/wp-$suite.log" | tee -a artifacts/wordpress-ci-summary/results.txt || true
            else
              printf '%s=FAIL\n' "$suite" | tee -a artifacts/wordpress-ci-summary/results.txt
              grep -E '^MGZ_TEST_FAILURE suite=[a-z]+ file=[A-Za-z0-9._-]+ line=[0-9]+ class=[A-Za-z0-9_\\]+ code=[A-Z0-9_-]+$' "$RUNNER_TEMP/wp-$suite.log" | tee -a artifacts/wordpress-ci-summary/results.txt || true
              echo 'Raw PHP/SQL diagnostics remain private on the disposable runner.'
              failed=1
            fi
            grep -E '^MGZ_TEST_BOOTSTRAP php=[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/wp-$suite.log" | tee -a artifacts/wordpress-ci-summary/results.txt || true
          done
          exit "$failed"
      - name: Check the legacy native routes over loopback HTTP
        shell: bash
        run: |
          set -euo pipefail
          phase=permalinks
          trap 'code=$?; printf "loopback-shell=FAIL phase:%s exit:%s\n" "$phase" "$code" | tee -a artifacts/wordpress-ci-summary/results.txt' ERR
          wp option update permalink_structure '/%postname%/' --quiet --path="$WP_ROOT" > "$RUNNER_TEMP/wp-permalinks.log" 2>&1
          phase=rewrite
          wp rewrite flush --path="$WP_ROOT" > "$RUNNER_TEMP/wp-rewrite.log" 2>&1
          printf 'loopback-setup=PASS rewrite\n' >> artifacts/wordpress-ci-summary/results.txt
          phase=server
          wp server --host=127.0.0.1 --port=8888 --path="$WP_ROOT" > "$RUNNER_TEMP/wp-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          sleep 0.3
          kill -0 "$server_pid"
          phase=requests
          node --input-type=module - <<'JS'
          import {appendFileSync} from 'node:fs';
          const origin='http://127.0.0.1:8888';
          const report=line=>{console.log(line);appendFileSync('artifacts/wordpress-ci-summary/results.txt',line+'\n');};
          function check(condition,label){if(!condition)throw new Error(label);}
          async function json(label,path,status,options={}) {
            let response;
            try{response=await fetch(origin+path,{...options,signal:AbortSignal.timeout(5000)});}catch{throw new Error(label+'-transport');}
            const text=await response.text();
            report('loopback-response='+label+' status:'+response.status+' bytes:'+Buffer.byteLength(text));
            check(response.status===status,label+'-status');
            check(/application\/json/i.test(response.headers.get('content-type')||''),label+'-content-type');
            let data;try{data=JSON.parse(text);}catch{throw new Error(label+'-json');}
            return data;
          }
          try {
            let ready=false;
            for(let i=0;i<30;i++) {try{const response=await fetch(origin+'/?rest_route=/mgz-plugin-admin/v1/health',{signal:AbortSignal.timeout(2000)});if(response.ok&&(await response.json()).status==='ok'){ready=true;break;}}catch{}await new Promise(resolve=>setTimeout(resolve,500));}
            check(ready,'server-readiness');
            const expected=await json('canonical-key','/?rest_route=/mgz-plugin-admin/v1/public-key',200);
            const actual=await json('legacy-key','/api/public-key',200);
            check(actual.algorithm==='RSA-SHA256'&&actual.modulusHex===expected.modulusHex,'public-key-mismatch');
            for(const [label,path] of [['legacy-check','/api/plugin/check'],['canonical-check','/?rest_route=/mgz-plugin-admin/v1/plugin/check']]) {
              await json(label,path,400,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
            }
            const missingType=await json('missing-content-type','/api/plugin/activate',415,{method:'POST',body:new Uint8Array([123,125])});
            check(missingType.error?.code==='JSON_REQUIRED','missing-content-type-code');
            report('loopback-http=PASS requests:5');
          } catch(error) {
            const label=/^[a-z-]+$/.test(error.message)?error.message:'unexpected';
            report('loopback-http=FAIL check:'+label);process.exitCode=1;
          }
          JS
      # The ZIP contains private PHP source. Never upload it, raw logs, SQL,
      # wp-config.php, keys or fixtures to this public Actions repository.
      - name: Upload sanitized test statistics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-test-statistics-php-${{ matrix.php }}
          path: artifacts/wordpress-ci-summary/results.txt
          if-no-files-found: ignore
          retention-days: 7
