name: LRC Suite - Windows and macOS

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '私库提交 SHA / Private source commit SHA (or main)'
        required: true
        default: main
        type: string
      sign_windows:
        description: '启用 Windows 签名防篡改并签名 / Sign and protect Windows binaries'
        required: true
        default: false
        type: boolean
      trust_private_ca:
        description: '仅本次临时 runner 信任所提供私有 CA / Trust provided private CA on this runner only'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lrc-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  language-pack:
    name: Offline language pack - ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows-x64
            executable: lrc-language-helper.exe
          - os: macos-15-intel
            platform: macOS-x64
            executable: lrc-language-helper
          - os: macos-15
            platform: macOS-arm64
            executable: lrc-language-helper
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Fetch private source / 拉取私有源码
        uses: actions/checkout@v4
        with:
          repository: mgz0227/Lyrics-Assistant
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TOKEN_MGZ }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: offline/requirements*.txt
      - name: Build local dictionaries and models / 打包本地词典和模型
        run: python offline/build.py all
      - name: Test real offline inference / 验证真实离线生成
        run: python -m unittest discover -s offline/tests -v
      - name: Verify packaged executable / 验证打包程序
        run: python offline/smoke.py --helper offline/dist/lrc-language-helper/${{ matrix.executable }}
      - name: Archive Windows language pack / 打包 Windows 语言包
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath offline/dist/lrc-language-helper -DestinationPath LRC-Language-Pack-${{ matrix.platform }}.zip
      - name: Archive macOS language pack / 打包 macOS 语言包
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent offline/dist/lrc-language-helper LRC-Language-Pack-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LRC-Language-Pack-${{ matrix.platform }}
          path: LRC-Language-Pack-${{ matrix.platform }}.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  web-api:
    name: Local lyric workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch private source / 拉取私有源码
        uses: actions/checkout@v4
        with:
          repository: mgz0227/Lyrics-Assistant
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TOKEN_MGZ }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows x64 - VST3 AAX Standalone
            artifact: LRC-Suite-Windows-x64
          - os: macos-14
            name: macOS Universal - VST3 AU AAX Standalone
            artifact: LRC-Suite-macOS-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      LRC_PUBLIC_KEY_HEX: ${{ vars.LRC_PUBLIC_KEY_HEX }}
      LRC_API_ORIGIN: ${{ vars.LRC_API_ORIGIN || 'http://127.0.0.1:4318' }}
      LRC_WINDOWS_CERT_SHA256: ${{ vars.LRC_WINDOWS_CERT_SHA256 }}
    steps:
      - name: Fetch private source / 拉取私有源码
        uses: actions/checkout@v4
        with:
          repository: mgz0227/Lyrics-Assistant
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TOKEN_MGZ }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $protection = if ('${{ inputs.sign_windows }}' -eq 'true') { 'ON' } else { 'OFF' }
          $tests = if ($protection -eq 'ON') { 'OFF' } else { 'ON' }
          cmake -S plugin -B build -G 'Visual Studio 17 2022' -A x64 -DLYRICUE_BUILD_AAX=ON "-DLYRICUE_AAX_SDK=$pwd/SDK/aax" "-DLYRICUE_PUBLIC_KEY_HEX=$env:LRC_PUBLIC_KEY_HEX" "-DLYRICUE_SERVER_URL=$env:LRC_API_ORIGIN" "-DLRC_ENFORCE_INTEGRITY=$protection" "-DLRC_WINDOWS_CERT_SHA256=$env:LRC_WINDOWS_CERT_SHA256" "-DBUILD_TESTING=$tests"
      - name: Configure macOS universal / 配置双架构
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S plugin -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DLYRICUE_BUILD_AAX=ON "-DLYRICUE_AAX_SDK=$PWD/SDK/aax" "-DLYRICUE_PUBLIC_KEY_HEX=$LRC_PUBLIC_KEY_HEX" "-DLYRICUE_SERVER_URL=$LRC_API_ORIGIN"
      - name: Build / 编译
        run: cmake --build build --config Release --parallel 2
      - name: Signing script checks / 签名脚本检查
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/sign-windows.test.ps1
      - name: Native tests / 原生测试
        if: runner.os != 'Windows' || !inputs.sign_windows
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Sign and verify Windows / 签署并校验 Windows
        if: runner.os == 'Windows' && inputs.sign_windows
        timeout-minutes: 5
        shell: pwsh
        env:
          LRC_WINDOWS_PFX_BASE64: ${{ secrets.LRC_WINDOWS_PFX_BASE64 }}
          LRC_WINDOWS_PFX_PASSWORD: ${{ secrets.LRC_WINDOWS_PFX_PASSWORD }}
          LRC_WINDOWS_CA_CHAIN_PEM: ${{ secrets.LRC_WINDOWS_CA_CHAIN_PEM }}
          LRC_WINDOWS_TIMESTAMP_URL: ${{ vars.LRC_WINDOWS_TIMESTAMP_URL }}
        run: |
          $trustPrivateCA = '${{ inputs.trust_private_ca }}' -eq 'true'
          ./scripts/sign-windows.ps1 -BuildDirectory build -TrustPrivateCA:$trustPrivateCA
          'LRC_WINDOWS_AUTHENTICODE_SIGNED=true' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Stage binaries only / 仅打包二进制
        run: node scripts/package-native.mjs build ${{ matrix.artifact }}
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath "artifacts/${{ matrix.artifact }}" -DestinationPath "artifacts/${{ matrix.artifact }}.zip"
      - name: Check universal binaries and archive macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          lipo "artifacts/${{ matrix.artifact }}/LRC Suite.vst3/Contents/MacOS/LRC Suite" -verify_arch arm64 x86_64
          lipo "artifacts/${{ matrix.artifact }}/LRC Suite.component/Contents/MacOS/LRC Suite" -verify_arch arm64 x86_64
          lipo "artifacts/${{ matrix.artifact }}/LRC Suite.aaxplugin/Contents/MacOS/LRC Suite" -verify_arch arm64 x86_64
          ditto -c -k --sequesterRsrc --keepParent "artifacts/${{ matrix.artifact }}" "artifacts/${{ matrix.artifact }}.zip"
      - name: Upload builds / 上传构建包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ runner.os == 'Windows' && inputs.sign_windows && 'authenticode' || 'unsigned' }}
          path: artifacts/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14
