name: LRC Suite - Windows and macOS

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '私库提交 SHA / Private source commit SHA (or main)'
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: lrc-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  language-pack:
    name: Offline language pack - ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows-x64
            executable: lrc-language-helper.exe
          - os: macos-15-intel
            platform: macOS-x64
            executable: lrc-language-helper
          - os: macos-15
            platform: macOS-arm64
            executable: lrc-language-helper
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Fetch private source / 拉取私有源码
        uses: actions/checkout@v7.0.1
        with:
          repository: mgz0227/Lyrics-Assistant
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TOKEN_MGZ }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: offline/requirements*.txt
      - name: Build local dictionaries and models / 打包本地词典和模型
        run: python offline/build.py all
      - name: Test real offline inference / 验证真实离线生成
        run: python -m unittest discover -s offline/tests -v
      - name: Verify packaged executable / 验证打包程序
        run: python offline/smoke.py --helper offline/dist/lrc-language-helper/${{ matrix.executable }}
      - name: Archive Windows language pack / 打包 Windows 语言包
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath offline/dist/lrc-language-helper -DestinationPath LRC-Language-Pack-${{ matrix.platform }}.zip
      - name: Archive macOS language pack / 打包 macOS 语言包
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent offline/dist/lrc-language-helper LRC-Language-Pack-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: LRC-Language-Pack-${{ matrix.platform }}
          path: LRC-Language-Pack-${{ matrix.platform }}.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  web-api:
    name: Local lyric workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch private source / 拉取私有源码
        uses: actions/checkout@v7.0.1
        with:
          repository: mgz0227/Lyrics-Assistant
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TOKEN_MGZ }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  native:
    name: ${{ matrix.name }} - ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
        variant: [Development, Production]
        # A protected macOS build requires a real Apple publishing identity.
        exclude: ${{ fromJSON(vars.LRC_MAC_TEAM_ID == '' && '[{"os":"macos-14","variant":"Production"}]' || '[]') }}
        include:
          - os: windows-2022
            name: Windows x64 - VST3 AAX Standalone
            artifact: LRC-Suite-Windows-x64
          - os: macos-14
            name: macOS Universal - VST3 AU AAX Standalone
            artifact: LRC-Suite-macOS-universal
          - variant: Development
            integrity: 'OFF'
            testing: 'ON'
          - variant: Production
            integrity: 'ON'
            testing: 'OFF'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      LRC_PUBLIC_KEY_HEX: ${{ vars.LRC_PUBLIC_KEY_HEX }}
      LRC_API_ORIGIN: ${{ vars.LRC_API_ORIGIN || 'https://mgz.hk' }}
      LRC_WINDOWS_AUTHENTICODE_SIGNED: 'false'
      LRC_WINDOWS_CERT_SHA256: ${{ vars.LRC_WINDOWS_CERT_SHA256 }}
      LRC_MAC_TEAM_ID: ${{ vars.LRC_MAC_TEAM_ID }}
    steps:
      - name: Fetch private source / 拉取私有源码
        uses: actions/checkout@v7.0.1
        with:
          repository: mgz0227/Lyrics-Assistant
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TOKEN_MGZ }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify packaging variants / 验证双版本打包
        run: node --test scripts/package-native.test.mjs
      - name: Report pending macOS production identity / 说明 macOS 正式版缺少签名身份
        if: runner.os == 'macOS' && matrix.variant == 'Development' && env.LRC_MAC_TEAM_ID == ''
        run: echo 'macOS Production 未构建：请在仓库变量配置 LRC_MAC_TEAM_ID，后续构建会自动加入受保护正式版。/ Set LRC_MAC_TEAM_ID to enable the protected macOS Production build.' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S plugin -B build -G 'Visual Studio 17 2022' -A x64 -DLYRICUE_BUILD_AAX=ON "-DLYRICUE_AAX_SDK=$pwd/SDK/aax" "-DLYRICUE_PUBLIC_KEY_HEX=$env:LRC_PUBLIC_KEY_HEX" "-DLYRICUE_SERVER_URL=$env:LRC_API_ORIGIN" -DLYRICUE_DEV_LICENSE=OFF -DLRC_ENFORCE_INTEGRITY=${{ matrix.integrity }} "-DLRC_WINDOWS_CERT_SHA256=$env:LRC_WINDOWS_CERT_SHA256" -DBUILD_TESTING=${{ matrix.testing }}
      - name: Configure macOS universal / 配置双架构
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S plugin -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DLYRICUE_BUILD_AAX=ON "-DLYRICUE_AAX_SDK=$PWD/SDK/aax" "-DLYRICUE_PUBLIC_KEY_HEX=$LRC_PUBLIC_KEY_HEX" "-DLYRICUE_SERVER_URL=$LRC_API_ORIGIN" -DLYRICUE_DEV_LICENSE=OFF -DLRC_ENFORCE_INTEGRITY=${{ matrix.integrity }} "-DLRC_MAC_TEAM_ID=$LRC_MAC_TEAM_ID" -DBUILD_TESTING=${{ matrix.testing }}
      - name: Build / 编译
        run: cmake --build build --config Release --parallel 2
      - name: Signing tool negative checks / 签名工具拒绝路径检查
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/sign-windows.test.ps1
      - name: Native tests / 原生测试
        if: matrix.variant == 'Development'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage binaries only / 仅打包二进制
        run: node scripts/package-native.mjs build ${{ matrix.artifact }}-${{ matrix.variant }}
      - name: Build unsigned Windows installer / 构建未签名 Windows 安装包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -StageDirectory "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}" -OutputDirectory artifacts/windows-installer
      - name: Verify Windows install upgrade and uninstall / 验证安装升级与卸载
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -LiteralPath artifacts/windows-installer -Filter '*-Setup.exe')
          if ($setup.Count -ne 1) { throw 'Expected exactly one unsigned installer.' }
          ./scripts/package-windows.test.ps1 -InstallerPath $setup[0].FullName -StageDirectory "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}" -Unsigned
      - name: Upload Windows installer / 上传 Windows 安装包
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}-${{ matrix.variant }}-installer-unsigned
          path: artifacts/windows-installer/*-Setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}" -DestinationPath "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}.zip"
      - name: Check universal binaries and archive macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          lipo "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}/LRC Suite.vst3/Contents/MacOS/LRC Suite" -verify_arch arm64 x86_64
          lipo "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}/LRC Suite.component/Contents/MacOS/LRC Suite" -verify_arch arm64 x86_64
          lipo "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}/LRC Suite.aaxplugin/Contents/MacOS/LRC Suite" -verify_arch arm64 x86_64
          lipo "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}/LRC Suite.app/Contents/MacOS/LRC Suite" -verify_arch arm64 x86_64
          ditto -c -k --sequesterRsrc --keepParent "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}" "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}.zip"
      - name: Build system installer / 构建系统级安装包
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(sed -n 's/^LRC Suite //p' "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}/BUILD-INFO.txt" | head -n 1)
          package="artifacts/LRC-Suite-${version}-macOS-universal-${{ matrix.variant }}-unsigned.pkg"
          bash scripts/package-macos.sh "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}" "$package"
          bash scripts/package-macos.test.sh "$package" "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}"
          echo "LRC_MAC_INSTALLER=$package" >> "$GITHUB_ENV"
      - name: Verify system installation / 验证系统目录安装
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # This is a disposable GitHub-hosted runner, never a customer machine.
          sudo /usr/sbin/installer -pkg "$LRC_MAC_INSTALLER" -target /
          bundles=('LRC Suite.app' 'LRC Suite.vst3' 'LRC Suite.component' 'LRC Suite.aaxplugin')
          paths=('/Applications' '/Library/Audio/Plug-Ins/VST3/NyaSama Audio' '/Library/Audio/Plug-Ins/Components' '/Library/Application Support/Avid/Audio/Plug-Ins/NyaSama Audio')
          for index in 0 1 2 3; do
            installed="${paths[$index]}/${bundles[$index]}"
            test -d "$installed"
            diff -qr "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}/${bundles[$index]}" "$installed"
            test "$(stat -f '%u:%g' "$installed")" = '0:0'
          done
          /usr/sbin/pkgutil --pkg-info studio.lrcsuite.installer
          ditto -c -k --sequesterRsrc --keepParent "$LRC_MAC_INSTALLER" "artifacts/${{ matrix.artifact }}-${{ matrix.variant }}-installer.zip"
      - name: Upload macOS installer / 上传 macOS 安装包
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}-${{ matrix.variant }}-installer-unsigned
          path: artifacts/${{ matrix.artifact }}-${{ matrix.variant }}-installer.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload builds / 上传构建包
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}-${{ matrix.variant }}-unsigned
          path: artifacts/${{ matrix.artifact }}-${{ matrix.variant }}.zip
          if-no-files-found: error
          retention-days: 14
